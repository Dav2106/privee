<article class="product-card">
  <div class="image-frame">
    <img [src]="imageSrc" [alt]="title" loading="lazy">
  </div>
  <div class="product-details">
    <p class="company">{{ subtitle }}</p>
    <h2>{{ title }}</h2>
    <p class="description">{{ description }}</p>
    <p class="price">₡{{ price }}</p>
  </div>
</article>
